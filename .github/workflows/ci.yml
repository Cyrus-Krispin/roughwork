name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run verify
      - name: Block runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  macos-artifact:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run package:e2e
      - run: npm run verify:packaged-flow
      - run: npm run package
      - run: npm run verify:artifact
      - run: npm run verify:packaged-onboarding
      - run: npm run make:from-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-ai-0.1.0-macos-apple-silicon-internal
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error
